name: Build Hamster APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build APK with NDK & CMake
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m\ -Xss8m\ -XX:MaxMetaspaceSize=1024m\ -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Command-line Tools, SDK & NDK
        shell: bash
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip -o /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools_extracted
            mv /tmp/cmdtools_extracted/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            rm -rf /tmp/cmdtools.zip /tmp/cmdtools_extracted
          fi

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          set +o pipefail
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.1.8937393" < <(yes) > /dev/null
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Fix Layout Resources, Mipmap Icons and Gradle JVM Options
        shell: bash
        run: |
          set -e
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Xss8m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          if [ -f "app/src/main/res/layout/float_icon.xml" ]; then
            sed -i 's|@android:ic_menu_manage|@android:drawable/ic_menu_manage|g' app/src/main/res/layout/float_icon.xml
          fi

          python3 - << 'PY'
          import os, struct, zlib

          def make_png(path, size=48, rgba=(33, 150, 243, 255)):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              r, g, b, a = rgba
              raw = bytearray()
              row = bytes([r, g, b, a]) * size
              for _ in range(size):
                  raw.append(0)
                  raw.extend(row)
              def chunk(tag, data):
                  return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", zlib.crc32(tag + data) & 0xffffffff)
              ihdr = struct.pack(">IIBBBBB", size, size, 8, 6, 0, 0, 0)
              idat = zlib.compress(bytes(raw), level=6)
              png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", idat) + chunk(b"IEND", b"")
              with open(path, "wb") as f:
                  f.write(png)

          for density, px in [("mipmap-mdpi", 48), ("mipmap-hdpi", 72), ("mipmap-xhdpi", 96), ("mipmap-xxhdpi", 144), ("mipmap-xxxhdpi", 192)]:
              make_png(f"app/src/main/res/{density}/ic_launcher.png", px)
              make_png(f"app/src/main/res/{density}/ic_launcher_round.png", px)
          PY

      - name: Install Gradle 7.5.1 and Build Debug APK
        shell: bash
        run: |
          set -e
          GRADLE_VER="7.5.1"
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle_dist
          GRADLE_BIN="/tmp/gradle_dist/gradle-${GRADLE_VER}/bin/gradle"
          chmod +x "$GRADLE_BIN"

          "$GRADLE_BIN" wrapper --gradle-version "${GRADLE_VER}" --distribution-type bin --no-daemon
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copy APK to Known Artifact Path
        shell: bash
        run: |
          set -e
          APK_FILE=$(find . -path "*/build/outputs/apk/debug/*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Debug APK not found"
            exit 1
          fi
          mkdir -p /tmp/artifact_apk
          cp "$APK_FILE" /tmp/artifact_apk/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hamster-mod-menu-apk
          path: /tmp/artifact_apk/app-debug.apk
