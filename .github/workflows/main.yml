name: Build Hamster APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build APK with NDK & CMake
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK and Build Tools
      run: |
        sdkmanager --install "ndk;25.1.8937393" "build-tools;33.0.2" "platforms;android-33"

    - name: Accept SDK Licenses Automatically
      run: |
        yes | sdkmanager --licenses

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: HamsterModMenu

    - name: Build Debug APK
      run: ./gradlew assembleDebug
      working-directory: HamsterModMenu

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: hamster-mod-menu-apk
        path: HamsterModMenu/app/build/outputs/apk/debug/app-debug.apkapp/build/outputs/apk/debug/app-debug.apk
