name: Build Hamster APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build APK with NDK & CMake
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Pre-accept Android SDK Licenses
        shell: bash
        run: |
          SDK_DIR="/usr/local/lib/android/sdk"
          mkdir -p "$SDK_DIR/licenses"
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5fd87478995059513033d29c79724e75614b\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK_DIR/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" > "$SDK_DIR/licenses/android-sdk-preview-license"
          printf "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > "$SDK_DIR/licenses/google-gdk-license"
          printf "60108f3c477d54973782738d02960d0b0a126e4e" > "$SDK_DIR/licenses/android-googletv-license"
          printf "e9acab5b5b5a1e5b5b5a1e5b5b5a1e5b5b5a1e5b" > "$SDK_DIR/licenses/android-googlexr-license"
          printf "d975f751698a77b662f1254ddbe6ee349f6bc705" > "$SDK_DIR/licenses/mips-android-sysimage-license"
          printf "846c05457b3b71989a7f14b3c0b3b1e5b3b71989" > "$SDK_DIR/licenses/intel-android-sysimage-license"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and Build Tools
        shell: bash
        run: |
          set +o pipefail
          yes "y" | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;25.1.8937393" "build-tools;33.0.2" "platforms;android-33"
          yes "y" | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: HamsterModMenu

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: HamsterModMenu

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hamster-mod-menu-apk
          path: HamsterModMenu/app/build/outputs/apk/debug/app-debug.apk
